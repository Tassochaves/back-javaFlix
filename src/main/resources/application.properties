spring.application.name=java-flix
spring.profiles.active=dev

# CONFIGURAÇÕES DO BANCO DE DADOS
spring.datasource.url=jdbc:mysql://localhost:3306/java_flix_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURAÇÕES DO JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# CONFIGURAÇÕES DE MULTIPART (UPLOADS)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# OTIMIZAÇÃO DO SERVER & TOMCAT
# Impede queda de conexão em erros de upload grande
server.tomcat.max-swallow-size=-1
# Permite posts de formulários de qualquer tamanho
server.tomcat.max-form-post-size=-1