spring.application.name=java-flix
spring.profiles.active=dev

app.frontend.url:${FRONT_URL}

# CONFIGURAÇÕES DO BANCO DE DADOS
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURAÇÕES DO JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# CONFIGURAÇÕES DE MULTIPART (UPLOADS)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# OTIMIZAÇÃO DO SERVER & TOMCAT
# Impede queda de conexão em erros de upload grande
server.tomcat.max-swallow-size=-1
# Permite posts de formulários de qualquer tamanho
server.tomcat.max-form-post-size=-1

# CAMINHOS CUSTOMIZADOS
server.upload.video-dir=uploads/videos
server.upload.image-dir=uploads/images

# CONFIGURAÇÕES SPRING MAIL
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# CONFIGURAÇÕES E VARIAVEIS PARA JWT
jwt.secret=${YOUR_SECRET_KEY}
